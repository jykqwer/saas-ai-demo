apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: saas-ai-demo
  namespace: saas-ai-demo
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: saas-ai-demo-redirect-to-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - zhaocaidog.space
      secretName: zhaocaidog-tls
  rules:
    - host: zhaocaidog.space
      http:
        paths:
          # API 直接进入后端，避免流式 SSE 响应经过额外一层 nginx 缓冲。
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
